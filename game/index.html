<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suspicious Business — Open World</title>
<style>
:root{--gold:#f2b84b;--panel:#171b22ed;--line:#414956;--muted:#aab2bd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e;color:#eee;font:14px system-ui,Segoe UI,sans-serif}#stage{position:relative;width:100vw;height:100vh}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:absolute;top:14px;left:14px;display:flex;gap:15px;align-items:center;padding:10px 14px;background:#111a;border:1px solid #ffffff20;border-radius:12px;backdrop-filter:blur(8px);font-weight:700}#wanted{color:#f2b84b;letter-spacing:3px}#hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#111d;border:1px solid #ffffff25;padding:10px 16px;border-radius:10px;color:#fff}#loc{position:absolute;right:14px;top:14px;background:#111b;padding:9px 13px;border-radius:10px;color:#ddd}#phone{position:absolute;right:24px;bottom:22px;width:290px;height:510px;max-height:80vh;background:#11151c;border:5px solid #454c59;border-radius:32px;padding:15px;box-shadow:0 18px 60px #000c;display:none;overflow:hidden}#phone.show{display:block}#notch{height:18px;width:90px;border-radius:20px;background:#050608;margin:-5px auto 12px}#phhead{display:flex;justify-content:space-between;color:#ddd;font-weight:700;margin-bottom:12px}#apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .app{border:0;border-radius:15px;background:#252c38;color:white;padding:13px 4px;min-height:76px;font-size:12px}.app i{display:block;font-size:25px;font-style:normal;margin-bottom:5px}#screen{display:none;height:390px;overflow:auto;background:#f1f2f4;color:#16191e;border-radius:16px;padding:12px}#screen.active{display:block}#apps.hidden{display:none}#screen button{background:#252c38;color:white;border:0;border-radius:8px;padding:8px;margin:3px}#screen input{width:100%;padding:9px;border:1px solid #aaa;border-radius:8px;margin:5px 0}#screen iframe{width:100%;height:310px;border:0;background:white}#phone .close{position:absolute;bottom:10px;left:35%;width:30%;height:5px;border:0;border-radius:5px;background:#ddd}#inventory,#dialog,#pause{position:absolute;inset:0;background:#080b0edb;display:none;align-items:center;justify-content:center}#inventory.show,#dialog.show,#pause.show{display:flex}.window{background:#171c25;border:1px solid #4a5362;border-radius:16px;padding:22px;min-width:320px;max-width:650px;box-shadow:0 20px 80px #000b}.window h2{margin:0 0 14px;color:var(--gold)}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{background:#242b36;border:1px solid #3d4654;border-radius:10px;padding:12px;text-align:center;min-width:90px}.window button{background:#303a48;color:#fff;border:1px solid #566174;border-radius:8px;padding:9px 13px;margin:4px;cursor:pointer}.window button:hover{border-color:var(--gold)}.gold{color:var(--gold)}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#151b24;border:1px solid #596273;border-radius:10px;padding:10px 15px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}#cross{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none;display:none}#cross:before,#cross:after{content:"";position:absolute;background:#fff;width:16px;height:2px;top:7px}#cross:after{transform:rotate(90deg)}
</style></head><body><div id="stage"><canvas id="game" width="1280" height="720"></canvas>
<div id="hud"><span id="cash">$100</span><span id="health">♥ 100</span><span id="weapon">Fists</span><span id="wanted">☆ ☆ ☆ ☆ ☆</span></div><div id="loc">DUSTY CREEK</div><div id="hint">WASD move · E enter / interact · F car · TAB weapons · ↑ phone · Shift sprint · Esc pause</div><div id="toast"></div><div id="cross"></div>
<div id="phone"><div id="notch"></div><div id="phhead"><span>9:41</span><span>●●●  ▰</span></div><div id="apps"><button class="app" data-app="contacts"><i>☎️</i>Contacts</button><button class="app" data-app="messages"><i>💬</i>Messages</button><button class="app" data-app="browser"><i>🌐</i>Browser</button><button class="app" data-app="map"><i>🗺️</i>Map</button><button class="app" data-app="bank"><i>💳</i>Bank</button><button class="app" data-app="camera"><i>📷</i>Camera</button><button class="app" data-app="missions"><i>📋</i>Missions</button><button class="app" data-app="music"><i>🎵</i>Music</button><button class="app" data-app="settings"><i>⚙️</i>Settings</button></div><div id="screen"></div><button class="close" id="phoneClose"></button></div>
<div id="inventory"><div class="window"><h2>WEAPON SELECT</h2><div class="items" id="weaponSlots"></div><p class="gold">Press 1–5 or click a weapon. TAB closes.</p></div></div>
<div id="dialog"><div class="window"><h2 id="dialogTitle">Building</h2><div id="dialogBody"></div><button id="dialogClose">Close · E</button></div></div>
<div id="pause"><div class="window"><h2>PAUSED</h2><p>Suspicious Business — Dusty Creek</p><button id="resume">Resume</button><button id="save">Save game</button><button id="reset">New game</button></div></div>
</div>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const WORLD={w:3000,h:2200},keys={},player={x:420,y:570,r:11,speed:190,health:100,money:100,weapon:0,inside:null,inCar:null,angle:0};
const weapons=[{name:'Fists',damage:8,range:38,ammo:Infinity,rate:380},{name:'Pistol',damage:25,range:260,ammo:48,rate:350},{name:'Shotgun',damage:55,range:150,ammo:18,rate:800},{name:'SMG',damage:12,range:230,ammo:120,rate:95},{name:'Rifle',damage:42,range:430,ammo:35,rate:550}];let wanted=0,police=[],bullets=[],lastShot=0,toastTimer,phoneOpen=false,phonePage='',paused=false,worldTime=0;
const buildings=[
{x:250,y:250,w:210,h:150,name:'Apartment 1',type:'apartment',color:'#8c6250',door:'south'},
{x:650,y:250,w:250,h:160,name:'Corner Shop',type:'shop',color:'#a17c42',door:'south'},
{x:1120,y:230,w:260,h:175,name:'Police Station',type:'police',color:'#526c86',door:'south'},
{x:1650,y:260,w:260,h:175,name:'Garage',type:'garage',color:'#596d57',door:'south'},
{x:2220,y:260,w:250,h:170,name:'Motel',type:'motel',color:'#986a65',door:'south'},
{x:260,y:1050,w:280,h:180,name:'Apartment 2',type:'apartment',color:'#8c6250',door:'south'},
{x:850,y:1100,w:300,h:180,name:'Diner',type:'diner',color:'#9a5546',door:'south'},
{x:1460,y:1050,w:300,h:190,name:'Warehouse',type:'warehouse',color:'#716c54',door:'south'},
{x:2140,y:1100,w:310,h:190,name:'Nightclub',type:'club',color:'#624c7c',door:'south'},
{x:2550,y:1660,w:280,h:180,name:'Hospital',type:'hospital',color:'#b5b7b5',door:'north'}
];
const roads=[{x:0,y:500,w:3000,h:150},{x:0,y:1350,w:3000,h:150},{x:950,y:0,w:150,h:2200},{x:2000,y:0,w:150,h:2200},{x:0,y:850,w:3000,h:100}];
let cars=[
{x:540,y:570,a:0,color:'#c94c42',name:'Comet',speed:0,owned:false},{x:1010,y:700,a:1.57,color:'#4782b8',name:'Sedan',speed:0},{x:1510,y:620,a:0,color:'#d4b34d',name:'Taxi',speed:0},{x:2300,y:750,a:3.14,color:'#888',name:'Hatchback',speed:0},{x:700,y:1500,a:0,color:'#4b9a70',name:'Pickup',speed:0},{x:1800,y:1600,a:1.57,color:'#a45b9c',name:'Coupe',speed:0}
];
let peds=Array.from({length:24},(_,i)=>({x:150+((i*317)%2600),y:170+((i*197)%1850),hp:100,alive:true,color:['#c78c62','#6886a6','#b2a16a','#a36d83'][i%4],name:['Local','Worker','Tourist','Resident'][i%4],vx:0,vy:0}));
let interior=null,saveState=null;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2200)}
function rectHit(x,y,r,b){return x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h}
function blocked(x,y){if(x<12||y<12||x>WORLD.w-12||y>WORLD.h-12)return true;for(const b of buildings){if(rectHit(x,y,player.r,b))return true}return false}
function nearestBuilding(){return buildings.find(b=>Math.hypot(player.x-(b.x+b.w/2),player.y-(b.y+b.h/2))<Math.max(b.w,b.h)*.7&&player.y>b.y-35&&player.y<b.y+b.h+65)}
function enterBuilding(b){interior=b;player.inside=b;player.exitX=player.x;player.exitY=player.y;player.x=640;player.y=490;toast('Entered '+b.name);$('#loc').textContent=b.name.toUpperCase();drawInterior()}
function drawInterior(){ctx.fillStyle='#38352f';ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.fillStyle='#5b5549';ctx.fillRect(80,80,1120,760);ctx.strokeStyle='#887c68';ctx.lineWidth=12;ctx.strokeRect(80,80,1120,760);ctx.fillStyle='#302a24';for(let i=0;i<5;i++)ctx.fillRect(180+i*190,180,100,50);ctx.fillStyle='#a78c63';ctx.fillRect(500,620,260,70);ctx.fillStyle='#eee';ctx.font='26px sans-serif';ctx.fillText(interior.name,100,130);ctx.fillText('EXIT  →  E',1030,500);if(interior.type==='garage'){ctx.fillStyle='#b18a43';ctx.fillRect(400,300,260,100);ctx.fillStyle='#171717';ctx.font='20px system-ui';ctx.fillText('ARMORY  ·  PRESS E',530,355)}}
function leaveBuilding(){player.inside=null;interior=null;player.x=player.exitX??420;player.y=(player.exitY??570)+35;toast('Back outside');$('#loc').textContent='DUSTY CREEK'}
function nearestSafe(x,y){return x+buildings[0].w/2}
function drawWorld(camX,camY){ctx.fillStyle='#354b36';ctx.fillRect(0,0,WORLD.w,WORLD.h);for(let i=0;i<1100;i++){let x=(i*7919)%WORLD.w,y=(i*3571)%WORLD.h;ctx.fillStyle=i%2?'#3a523a':'#304531';ctx.fillRect(x,y,3,3)}
ctx.fillStyle='#34383e';roads.forEach(r=>ctx.fillRect(r.x,r.y,r.w,r.h));ctx.strokeStyle='#d4c17b';ctx.lineWidth=3;ctx.setLineDash([24,22]);roads.forEach(r=>{ctx.beginPath();if(r.w>r.h){ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2)}else{ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h)}ctx.stroke()});ctx.setLineDash([]);
buildings.forEach(b=>{ctx.fillStyle='#0005';ctx.fillRect(b.x+10,b.y+12,b.w,b.h);ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffffff22';ctx.fillRect(b.x,b.y,b.w,18);ctx.fillStyle='#222';ctx.fillRect(b.x+b.w/2-18,b.y+b.h-8,36,10);ctx.fillStyle='#f1e8cf';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText(b.name,b.x+b.w/2,b.y-12);for(let x=b.x+25;x<b.x+b.w-15;x+=55){ctx.fillStyle='#b9d4df';ctx.fillRect(x,b.y+38,27,28)}})
cars.forEach(c=>drawCar(c));peds.forEach(p=>{if(!p.alive)return;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y+8,9,4,0,0,7);ctx.fill();ctx.fillStyle=p.color;ctx.fillRect(p.x-6,p.y-9,12,17);ctx.fillStyle='#d4a47e';ctx.fillRect(p.x-5,p.y-17,10,9)});
police.forEach(p=>{ctx.fillStyle='#263e65';ctx.fillRect(p.x-7,p.y-10,14,21);ctx.fillStyle='#f4f4f4';ctx.fillRect(p.x-5,p.y-18,10,9);ctx.fillStyle='#e34b4b';ctx.fillRect(p.x-8,p.y-23,7,4);ctx.fillStyle='#4289ff';ctx.fillRect(p.x+1,p.y-23,7,4)});
bullets.forEach(b=>{ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill()});
if(!player.inCar){ctx.fillStyle='#171717';ctx.fillRect(player.x-5,player.y+2,10,9);ctx.fillStyle='#e0b17d';ctx.fillRect(player.x-6,player.y-12,12,13);ctx.fillStyle='#c38b38';ctx.fillRect(player.x-7,player.y-17,14,7);if(weapons[player.weapon].name!=='Fists'){ctx.strokeStyle='#ddd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x,player.y-5);ctx.lineTo(player.x+Math.cos(player.angle)*19,player.y-5+Math.sin(player.angle)*19);ctx.stroke()}}}
function drawCar(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle='#0008';ctx.fillRect(-25,-10,55,26);ctx.fillStyle=c.color;ctx.fillRect(-27,-13,54,26);ctx.fillStyle='#202d39';ctx.fillRect(-13,-10,25,20);ctx.fillStyle='#d8e5eb';ctx.fillRect(-23,-10,8,20);ctx.fillRect(16,-10,7,20);ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);if(player.inside){drawInterior()}else{const cx=clamp(player.x-W/2,0,WORLD.w-W),cy=clamp(player.y-H/2,0,WORLD.h-H);ctx.save();ctx.translate(-cx,-cy);drawWorld(cx,cy);ctx.restore()}$('#cash').textContent='$'+player.money;$('#health').textContent='♥ '+player.health;$('#weapon').textContent=weapons[player.weapon].name;$('#wanted').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);$('#cross').style.display=player.weapon?'block':'none';let target=nearestBuilding();$('#hint').textContent=player.inCar?'WASD drive · F exit car · Space handbrake · E interact':player.inside?'E exit building · WASD explore interior':'WASD move · E enter / interact · F car · TAB weapons · ↑ phone · Shift sprint · Esc pause';}
let last=performance.now();
function update(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(!paused&&!phoneOpen&&!$('#inventory').classList.contains('show')&&!$('#dialog').classList.contains('show')){worldTime+=dt;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),len=Math.hypot(dx,dy)||1;player.angle=Math.atan2(dy,dx);
if(player.inCar){let c=player.inCar;if(dx||dy){c.a=Math.atan2(dy,dx);c.speed=clamp(c.speed+dt*230,-120,280)}else c.speed*=.985;let nx=c.x+Math.cos(c.a)*c.speed*dt,ny=c.y+Math.sin(c.a)*c.speed*dt;if(nx>20&&ny>20&&nx<WORLD.w-20&&ny<WORLD.h-20){c.x=nx;c.y=ny}player.x=c.x;player.y=c.y}
else if(!player.inside){let sp=player.speed*(keys.shift?1.65:1),nx=player.x+dx/len*sp*dt,ny=player.y+dy/len*sp*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny}
police.forEach(p=>{let a=Math.atan2(player.y-p.y,player.x-p.x);p.x+=Math.cos(a)*90*dt;p.y+=Math.sin(a)*90*dt;if(Math.hypot(player.x-p.x,player.y-p.y)<24){player.health-=10*dt;if(player.health<=0){player.health=100;player.money=Math.max(0,player.money-100);wanted=0;police=[];player.inCar=null;toast('Busted! $100 fine.')}}});
bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let p of peds){if(p.alive&&Math.hypot(p.x-b.x,p.y-b.y)<14){p.hp-=b.damage;b.life=0;if(p.hp<=0){p.alive=false;raiseWanted(1)}break}}});bullets=bullets.filter(b=>b.life>0);
if(wanted&&police.length< wanted*2&&Math.random()<dt*.12){police.push({x:cl(player.x+500,30,WORLD.w-30),y:cl(player.y+350,30,WORLD.h-30)})}
if(wanted&&police.length===0&&Math.random()<dt*.01)wanted=Math.max(0,wanted-1);
}
render();requestAnimationFrame(update)}
function raiseWanted(n){wanted=cl(wanted+n,0,5);toast('Wanted level increased! Police alerted.')}
function nearbyCar(){return cars.find(c=>Math.hypot(c.x-player.x,c.y-player.y)<55)}
function interact(){if(player.inside){if(interior.type==='garage'&&Math.abs(player.x-530)<190&&Math.abs(player.y-350)<100){showDialog('Garage Armory','<p>Purchase equipment:</p><button onclick="window.buyWeapon(1,250)">Pistol + 48 rounds · $250</button><button onclick="window.buyWeapon(2,400)">Shotgun + 18 shells · $400</button><button onclick="window.buyWeapon(3,550)">SMG + 120 rounds · $550</button><button onclick="window.buyWeapon(4,800)">Rifle + 35 rounds · $800</button>');return}leaveBuilding();return}let b=nearestBuilding();if(b){enterBuilding(b);return}let p=peds.find(p=>p.alive&&Math.hypot(p.x-player.x,p.y-player.y)<35);if(p){showDialog(p.name,'Hey! What do you want? <br><button onclick="window.payPerson()">Give $10</button>');return}toast('Nothing to interact with here.')}
window.buyWeapon=(i,cost)=>{if(player.money<cost){toast('Not enough cash');return}player.money-=cost;weapons[i].ammo+=i===1?48:i===2?18:i===3?120:35;toast(weapons[i].name+' ammo purchased');$('#dialog').classList.remove('show')};window.payPerson=()=>{if(player.money>=10){player.money-=10;toast('You gave them $10.')}else toast('Not enough cash.');$('#dialog').classList.remove('show')};
function carAction(){if(player.inCar){player.inCar=null;player.x+=28;toast('Exited vehicle');return}let c=nearbyCar();if(c){player.inCar=c;c.speed=0;toast('Vehicle stolen: '+c.name);raiseWanted(1)}else toast('No vehicle nearby.')}
function shoot(){let w=weapons[player.weapon];if(!w||Date.now()-lastShot<w.rate)return;if(w.ammo<=0)return toast('Out of ammo');lastShot=Date.now();if(w.ammo!==Infinity)w.ammo--;let a=player.angle||0;bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a)*w.range*2,vy:Math.sin(a)*w.range*2,life:w.range/(w.range*2),damage:w.damage});if(player.weapon>0)raiseWanted(1)}
function weaponMenu(){let el=$('#weaponSlots');el.innerHTML='';weapons.forEach((w,i)=>{let d=document.createElement('div');d.className='slot';d.innerHTML='<b>'+(i+1)+'. '+w.name+'</b><br><small>'+(w.ammo===Infinity?'Unlimited':w.ammo+' rounds')+'</small>';d.onclick=()=>{player.weapon=i;$('#inventory').classList.remove('show')};el.append(d)});$('#inventory').classList.add('show')}
function phoneToggle(){phoneOpen=!phoneOpen;$('#phone').classList.toggle('show',phoneOpen);if(!phoneOpen)phoneHome()}
function phoneHome(){$('#apps').classList.remove('hidden');$('#screen').classList.remove('active');phonePage=''}
function openApp(name){$('#apps').classList.add('hidden');let s=$('#screen');s.classList.add('active');phonePage=name;let content={
contacts:'<h3>Contacts</h3><p>📞 Vinny — <button onclick="window.callContact()">Call</button></p><p>🏢 Landlord — unavailable</p><p>🚓 Emergency — 911</p>',
messages:'<h3>Messages</h3><p><b>Vinny:</b> You around? Need to talk.</p><p><b>Boss:</b> Keep a low profile.</p><input placeholder="Message..." id="msg"><button onclick="window.sendMsg()">Send</button><p id="msgout"></p>',
browser:'<h3>Dusty Browser</h3><p>Search the web</p><input id="url" value="https://example.com" placeholder="Enter website address"><button onclick="window.goBrowser()">Go</button><div id="browserResult">Enter a website address above. External websites may block embedding; use Open externally if needed.</div>',
map:'<h3>City Map</h3><p>Dusty Creek · 3 districts · 10 enterable buildings</p><p>🏠 Apartments　🚓 Police　🏪 Shops　🔧 Garage</p><button onclick="window.mapClose()">Close map</button>',
bank:'<h3>Dusty Bank</h3><p>Available balance</p><h2>$'+player.money+'</h2><p>Account: •••• 1984</p>',
camera:'<h3>Camera</h3><p>📷 Snapshot</p><button onclick="window.snap()">Take photo</button><p id="snapmsg"></p>',
missions:'<h3>Jobs</h3><p>• Explore Dusty Creek</p><p>• Find a vehicle</p><p>• Visit the garage</p><p>• Stay out of trouble</p>',
music:'<h3>Radio</h3><p>Dusty FM</p><button onclick="window.radio()">▶ Play / Pause</button>',
settings:'<h3>Settings</h3><p>Controls: WASD, E, F, TAB, arrows, 1–5</p><button onclick="window.saveGame()">Save game</button>'
}[name]||'<h3>App</h3>';s.innerHTML=content}
window.goBrowser=()=>{let v=$('#url').value.trim();if(!/^https?:\/\//i.test(v))v='https://'+v;let safe;try{safe=new URL(v).href}catch(e){return toast('Invalid address')};$('#browserResult').innerHTML='<iframe sandbox="allow-forms allow-scripts allow-same-origin allow-popups" src="'+safe.replace(/"/g,'')+'"></iframe><p><a target="_blank" rel="noopener" href="'+safe.replace(/"/g,'')+'">Open externally ↗</a></p>'};
window.callContact=()=>toast('Calling Vinny… no answer.');window.sendMsg=()=>{$('#msgout').textContent='Message sent.';toast('Message sent')};window.mapClose=()=>phoneHome();window.snap=()=>$('#snapmsg').textContent='Photo saved to gallery (demo).';window.radio=()=>toast('Radio toggled');window.saveGame=()=>{saveGame();toast('Game saved')};
function saveGame(){localStorage.setItem('sb-openworld',JSON.stringify({player:{x:player.x,y:player.y,money:player.money,health:player.health},wanted}))}
$('#phoneClose').onclick=phoneToggle;document.querySelectorAll('.app').forEach(b=>b.onclick=()=>openApp(b.dataset.app));$('#dialogClose').onclick=()=>$('#dialog').classList.remove('show');$('#resume').onclick=()=>{paused=false;$('#pause').classList.remove('show')};$('#save').onclick=()=>{saveGame();toast('Saved')};$('#reset').onclick=()=>{localStorage.removeItem('sb-openworld');location.reload()};
onkeydown=e=>{let k=e.key.toLowerCase();if(['arrowup',' '].includes(k))e.preventDefault();if(k==='escape'){if(phoneOpen){phoneToggle();return}if($('#inventory').classList.contains('show')){$('#inventory').classList.remove('show');return}paused=!paused;$('#pause').classList.toggle('show',paused);return}if(k==='arrowup'){phoneToggle();return}if(k==='tab'){e.preventDefault();if($('#inventory').classList.contains('show'))$('#inventory').classList.remove('show');else weaponMenu();return}if(k==='e'&&!e.repeat){interact();return}if(k==='f'&&!e.repeat){carAction();return}if(k===' '){shoot();return}if(k>='1'&&k<='5'){player.weapon=+k-1;toast('Equipped '+weapons[player.weapon].name);return}if(['w','a','s','d','shift'].includes(k))keys[k]=true};
onkeyup=e=>{keys[e.key.toLowerCase()]=false};canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W,sy=(e.clientY-r.top)/r.height*H;let cx=cl(player.x-W/2,0,WORLD.w-W),cy=cl(player.y-H/2,0,WORLD.h-H);player.angle=Math.atan2(sy-H/2,sx-W/2);if(player.weapon)shoot()});
const saved=JSON.parse(localStorage.getItem('sb-openworld')||'null');if(saved){Object.assign(player,saved.player||{});wanted=saved.wanted||0}
requestAnimationFrame(update);
})();
