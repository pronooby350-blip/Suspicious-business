if(r.memo){const a=S.mem[n.id]=S.mem[n.id]||[];a.push(String(r.memo).slice(0,120));if(a.length>8)a.shift()}
if(n.id==='vinny'&&r.job===true&&S.min-jobT>120){jobT=S.min;S.money+=40;S.sus=cl(S.sus+6,0,100);sfx('money');toast('Side job done: +$40, suspicion up')}
const line=String(r.say||'...').slice(0,300);hist.push({w:n.n,t:line});speak(n,line);sfx('recv');await typeIt(add(n.n,'','n'),line);save()}
catch(e){if(e&&e.name!=='AbortError'&&cur===n){add(n.n,String(e.message).includes('NOKEY')?'(No API key yet. Open Settings from the menu.)':'(Connection failed. Check your key and model in Settings.)','n')}}
busy=false;if(cur)st('idle')}
$('#sd').onclick=send;$('#in').onkeydown=e=>{if(MG&&e.key===' '){e.preventDefault();stir();return}if(e.key==='Enter')send();e.stopPropagation()};$('#cl').onclick=close;
$('#mc').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Mic not supported here, type instead.');const r=new R();r.lang='en-US';st('listening');r.onresult=e=>{$('#in').value=e.results[0][0].transcript;send()};r.onerror=()=>{st('idle');toast('Mic blocked, type instead.')};r.onend=()=>{if(!busy)st('idle')};try{r.start()}catch(e){st('idle')}};
// phone + keys
const phone=()=>{if(cur||!run)return;sfx('phone');const p=$('#ph');p.classList.toggle('on');p.style.transform=''};
$('#cv1').onclick=()=>open(VIN);$('#ph2').onclick=()=>$('#ph').classList.remove('on');
onkeydown=e=>{if(document.activeElement.tagName==='INPUT')return;const k=e.key.toLowerCase();if(k==='arrowup'){e.preventDefault();phone();return}
if(k==='escape'){closeUI();close();$('#ph').classList.remove('on');return}
if(k==='e'&&run&&!cur&&!UI){if(S.near)open(S.near);else if(S.dr===4)openShop();else if(S.dr===1)openCraft()}if('wasd'.includes(k)&&k.length===1)keys[k]=1};
onkeyup=e=>{delete keys[e.key.toLowerCase()]};
// menu
function start(s){S=Object.assign(def(),s);run=true;$('#menu').classList.remove('on');$('#menu').style.transform='scale(1.1)';toast('Welcome to Dusty Creek. Stay calm.')}
$('#ct').onclick=()=>{const s=load();s?start(s):toast('No save found, start a New Game.')};
$('#ng').onclick=()=>start(def());
$('#rm').onclick=()=>{const s=load();if(s){s.mem={};s.rel={};try{localStorage.setItem('sb1',JSON.stringify(s))}catch(e){}}toast('NPC memories cleared.')};
setInterval(()=>{if(run)save()},5000);
$('#vtog').onclick=()=>{vOn=!vOn;$('#vtog').textContent='Voice: '+(vOn?'On':'Off');if(!vOn){try{speechSynthesis.cancel()}catch(e){}}};
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('click')});
document.addEventListener('mouseover',e=>{const b=e.target.closest('button');if(b&&b!==window.lb){window.lb=b;sfx('hover')}});
const setO=$('#set');$('#sbtn').onclick=async()=>{if(!window.sb)return toast('Settings work in the desktop app.');const c=await sb.getCfg();$('#sb_url').value=c.base;$('#sb_model').value=c.model;$('#sb_key').placeholder=c.hasKey?'Key saved (leave blank to keep it)':'API key (stored on this PC only)';setO.classList.add('on')};
$('#sb_x').onclick=()=>setO.classList.remove('on');
$('#sb_save').onclick=async()=>{await sb.setCfg({base:$('#sb_url').value,model:$('#sb_model').value,key:$('#sb_key').value});$('#sb_key').value='';setO.classList.remove('on');toast('AI settings saved.')};

let UI=0,MG=null;VP.boss=[.5,.8];
const nd=i=>{const b=B[i];return Math.abs(S.x-(b[0]+b[2]/2))<42&&S.y>b[1]+b[3]-2&&S.y<b[1]+b[3]+44};
const BAD=/\b(drugs?|weed|meth|cocaine|heroin|dealers?|narcotics?|marijuana|stash|cartel|smuggl\w*|illegal)\b/i;
const BOSS={id:'boss',n:'The Boss',c:'#6a2c91',p:'A smooth, impatient crime boss. Speaks briefly and politely threatens. Runs a fake blue candy business through the player. Everything stays fictional comedy; never explain how to make anything.'};
const MS=[
{t:'Cover Story',r:50,i:['Listen up. Your late uncle left you that workshop, and me a business arrangement.','We sell blue candy. Pure sugar. Totally legal. Nothing suspicious. Understood?','Go to the Supermarket in the southwest. Buy sugar, blue dye and a jar. Then head back to the workshop.'],o:[{d:'Go to the Supermarket (southwest corner)',ok:()=>nd(4)},{d:'Buy 1 Sugar, 1 Blue Dye and 1 Jar',ok:()=>{const v=S.inv;return v.sugar>0&&v.dye>0&&v.jar>0}},{d:'Go to your Workshop (north, press E at the door)',ok:()=>nd(1)}]},
{t:'First Batch',r:40,i:['Good. Now cook your first batch of blue candy. Stir carefully.','At the workshop, press E, start the batch, and hit Space when the marker is in the green. Do not burn it.'],o:[{d:'Cook a batch at the Workshop (E, then Space on green)',ok:()=>S.stars>0}]},
{t:'Special Delivery',r:30,i:['Dave down the road wants a taste of the candy. Two crystals.','And whatever you do, do not say anything weird around Officer Miller. He hears more than you think.'],o:[{d:'Have 2 crystals (cook more, buy supplies at the Supermarket)',ok:()=>S.inv.crystals>=2},{d:'Talk to Dave and press Give (2 crystals)',g:{id:'dave',n:2,p:60},ok:()=>S.gv==='dave'}]},
{t:'Big Order',r:80,i:['Bob called. He has theories about candy. He also wants three crystals.','Make a good batch, then deliver. Try not to listen to the theories.'],o:[{d:'Have 3 crystals (cook, restock at the Supermarket)',ok:()=>S.inv.crystals>=3},{d:'Talk to Bob and press Give (3 crystals)',g:{id:'bob',n:3,p:120},ok:()=>S.gv==='bob'}]},
{t:'Heat',r:150,s:()=>{S.pend=1},i:['Bad news. Miller heard something. He is coming for you.','Run to your apartment. Now. Do not stop for candy.'],o:[{d:'RUN to your Apartment (northwest) before Miller catches you!',ok:()=>nd(0)}]}];
function done(){const m=MS[S.mi];S.money+=m.r;sfx('money');toast('Mission complete: '+m.t+' +$'+m.r);S.mi++;S.oi=0;S.stars=0;S.gv='';S.rg=0;S.rgt=MS[S.mi]?5:0;NP[3].ch=0;save();if(!MS[S.mi])setTimeout(()=>toast('Chapter 1 complete. More soon!'),2500)}
function startChase(){const m=NP[3];if(m.ch)return;m.ch=1;m.ct=0;S.sus=Math.max(S.sus,70);closeUI();close();toast('Officer Miller is after you! RUN!');sfx('alarm')}
function arrest(){const m=NP[3];m.ch=0;m.x=m.hx;m.y=m.hy;S.x=640;S.y=215;S.money=Math.max(0,S.money-80);S.inv.crystals=0;S.sus=30;sfx('alarm');closeUI();close();toast('Arrested! Fined $80 and your crystals were confiscated.');if(MS[S.mi]&&MS[S.mi].t==='Heat')setTimeout(startChase,4000)}
function lose(){const m=NP[3];m.ch=0;m.ct=0;S.sus=Math.max(0,S.sus-25);m.tx=m.hx;m.ty=m.hy;toast('You lost Officer Miller.')}
function bad(n){S.sus=cl(S.sus+12,0,100);const m=NP[3];if(n.id==='miller'||Math.hypot(m.x-S.x,m.y-S.y)<150){startChase();return true}toast('Someone nearby gave you a funny look...');return false}
function tick(dt){const m=MS[S.mi],o=m&&m.o[S.oi],v=S.inv;
if(S.rgt>0){S.rgt-=dt;if(S.rgt<=0){S.rg=1;toast('Your phone is ringing! Press the up arrow.')}}
if(S.rg&&fr%160===0)sfx('phone');if(NP[3].ch&&fr%120===0)sfx('alarm');
if(S.pend&&!cur){S.pend=0;startChase()}
if(o&&!S.rg&&S.rgt<=0&&o.ok()){S.oi++;sfx('toast');if(S.oi>=m.o.length)done()}
if(MG)updMG(dt);
const ob=S.rg?'Boss is calling... press the up arrow':S.rgt>0?'Stay alert...':o?o.d:'Chapter 1 complete. More soon.';
$('#ob').textContent=(NP[3].ch?'RUN! ':'')+ob;$('#ob').style.color=NP[3].ch?'var(--r)':'var(--a)';
$('#pm').textContent=m?m.t:'Chapter 1 complete';$('#pi').textContent=ob;$('#pv').textContent='Sugar '+v.sugar+' · Dye '+v.dye+' · Jars '+v.jar+' · Crystals '+v.crystals;
$('#pa').style.display=S.rg?'':'none';
$('#gv').style.display=(o&&o.g&&cur&&cur.id===o.g.id&&!S.rg&&S.rgt<=0)?'':'none'}
async function answer(){if(!S.rg)return;S.rg=0;BOSS.sc=1;open(BOSS);BOSS.sc=0;const m=MS[S.mi];busy=true;st('speaking');let ok=1;
for(const l of m.i){if(cur!==BOSS){ok=0;break}hist.push({w:'Boss',t:l});speak(BOSS,l);sfx('recv');await typeIt(add('The Boss','','n'),l);await new Promise(r=>{const w=()=>{try{(window.speechSynthesis&&speechSynthesis.speaking&&vOn)?setTimeout(w,200):r()}catch(e){r()}};setTimeout(w,400)})}
if(ok){busy=false;st('idle')}m.s&&m.s()}
$('#pa').onclick=answer;$('#cb').onclick=()=>{if(S.rg)answer();else open(BOSS)};
$('#gv').onclick=()=>{const o=MS[S.mi]&&MS[S.mi].o[S.oi];if(!o||!o.g||busy)return;if(S.inv.crystals<o.g.n)return toast('You need '+o.g.n+' crystals.');S.inv.crystals-=o.g.n;S.money+=o.g.p;S.gv=o.g.id;sfx('money');$('#in').value='*hands you '+o.g.n+' bags of blue candy and you hand over $'+o.g.p+'*';send()};
const SH=[['sugar','Sugar',10],['dye','Blue Dye',15],['jar','Glass Jar',8]];
function drawShop(){const e=$('#shop');e.innerHTML='<b>Dusty Creek Supermarket</b><div style="color:var(--m)">You have $'+S.money+'</div>';SH.forEach(([k,n,p])=>{const b=document.createElement('button');b.textContent=n+' · $'+p+' (you have '+S.inv[k]+')';b.onclick=()=>{if(S.money<p)return toast('Not enough money.');S.money-=p;S.inv[k]++;sfx('money');drawShop()};e.append(b)});const c=document.createElement('button');c.textContent='Leave';c.onclick=closeUI;e.append(c)}
function openShop(){UI=1;sfx('open');$('#shop').classList.add('on');drawShop()}
function openCraft(){UI=1;sfx('open');$('#cr').classList.add('on');$('#crt').textContent='Needs 1 Sugar, 1 Blue Dye and 1 Jar per batch.'}
function closeUI(){if(!UI)return;UI=0;MG=null;$('#shop').classList.remove('on');$('#cr').classList.remove('on');sfx('close')}
function updMG(dt){MG.t+=dt*MG.sp;MG.pos=(Math.sin(MG.t*3)+1)/2;$('#mgm').style.left='calc('+MG.pos*100+'% - 4px)';$('#mgz').style.left=MG.z*100+'%';$('#mgz').style.width=MG.w*100+'%'}
function stir(){if(!MG)return;const h=MG.pos>=MG.z&&MG.pos<=MG.z+MG.w;if(h)MG.h++;sfx(h?'money':'warn');MG.r++;MG.sp+=.2;MG.z=Math.random()*(1-MG.w);
if(MG.r>=6){const q=MG.h>=5?3:MG.h>=3?2:MG.h>=1?1:0;S.stars=q;S.inv.crystals+=q;$('#crt').textContent=q?'Batch done! '+'★'.repeat(q)+' +'+q+' crystals':'Batch ruined. Try again.';MG=null;sfx(q?'toast':'alarm')}else $('#crt').textContent='Round '+(MG.r+1)+'/6 · hits '+MG.h}
$('#mgs').onclick=()=>{const v=S.inv;if(MG)return;if(!(v.sugar&&v.dye&&v.jar))return toast('Need 1 Sugar, 1 Blue Dye and 1 Jar.');v.sugar--;v.dye--;v.jar--;MG={r:0,h:0,t:0,sp:1.3,w:.2,z:.4,pos:0};$('#crt').textContent='Round 1/6'};
$('#mgx').onclick=stir;$('#mgc').onclick=closeUI;
</script></body></html>
